# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version = 1.20.1-port.1
maven_group = com.nbp.cobblemon_smartphone
archives_name = cobblemon_smartphone
enabled_platforms = fabric

# Minecraft properties
minecraft_version = 1.20.1

# Dependencies
fabric_loader_version = 0.16.5
fabric_api_version = 0.92.2+1.20.1
fabric_kotlin_version = 1.13.7+kotlin.2.2.21
cobblemon_version = 1.5.2+1.20.1

# Optional Dependencies
# Simple Voice Chat: we compile against the loader-agnostic API only (never bundled). Players get
# the actual mod from their modpack, and the Social app degrades gracefully without it. To test
# voice in dev, download the SVC jar into <loader>/run/mods —
# it is not auto-pulled because its published jar is built with a newer Loom than this project.
voicechat_api_version = 2.6.20
trinkets_version = 3.7.2
accessories_version = 1.0.0-beta.49+1.20.1
toms_storage_version = 1.20-1.6.8
cloth_config_version = 11.1.136
teamreborn_energy_version = 3.0.0
ae2_version = 15.2.13
